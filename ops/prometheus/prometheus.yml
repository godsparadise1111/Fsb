global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/fsb-alerts.yml

scrape_configs:
  - job_name: fsb-api
    scheme: https
    metrics_path: /api/health/metrics
    scrape_interval: 30s
    bearer_token_file: /run/secrets/fsb_metrics_token
    static_configs:
      - targets:
          - bpms.example.com
