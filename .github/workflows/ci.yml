name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install workspace dependencies from the committed lockfile
        run: test -s package-lock.json && npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:workflow --workspace @fsb/api
      - run: npm run test:forms --workspace @fsb/api
      - name: Validate operations shell scripts
        run: for script in scripts/ops/*.sh; do bash -n "$script"; done; bash -n scripts/staging-enterprise-acceptance.sh
      - name: Validate production Compose configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env -f compose.production.yaml config --quiet
      - name: Build production API and Web images
        run: docker compose --env-file .env -f compose.production.yaml build api web
