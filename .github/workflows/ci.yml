name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fsb_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fsb-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fsb_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install workspace dependencies from the committed lockfile
        run: test -s package-lock.json && npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:workflow --workspace @fsb/api
      - run: npm run test:forms --workspace @fsb/api
      - name: Validate migration ordering and duplicate table creation
        run: node scripts/ops/validate-migrations.mjs
      - name: Apply all SQL migrations to a clean PostgreSQL 16 database
        env:
          PGPASSWORD: fsb-ci-password
        run: |
          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            postgres:16-alpine sh -c '
              set -eu
              for migration in /workspace/apps/api/database/migrations/*.sql; do
                echo "Applying migration: $migration"
                psql -h 127.0.0.1 -U postgres -d fsb_ci -v ON_ERROR_STOP=1 -f "$migration"
              done
            '
      - name: Validate operations shell scripts
        run: for script in scripts/ops/*.sh; do bash -n "$script"; done; bash -n scripts/staging-enterprise-acceptance.sh; bash -n scripts/staging-workflow-idempotency.sh
      - name: Validate production Compose configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env -f compose.production.yaml config --quiet
      - name: Build production API and Web images
        run: docker compose --env-file .env -f compose.production.yaml build api web
