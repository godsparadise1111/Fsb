name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fsb_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fsb-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fsb_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install workspace dependencies from the committed lockfile
        run: test -s package-lock.json && npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:workflow --workspace @fsb/api
      - run: npm run test:forms --workspace @fsb/api
      - name: Validate migration ordering and duplicate table creation
        run: node scripts/ops/validate-migrations.mjs
      - name: Apply guarded migration runner and verify clean PostgreSQL 16 database
        env:
          DATABASE_URL: postgresql://postgres:fsb-ci-password@127.0.0.1:5432/fsb_ci
          PGPASSWORD: fsb-ci-password
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e PGPASSWORD="$PGPASSWORD" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            postgres:16 sh -c '
              set -eu
              printf "ephemeral CI-only backup marker\n" > /tmp/fsb-ci-backup
              sha256sum /tmp/fsb-ci-backup > /tmp/fsb-ci-backup.sha256
              FSB_MIGRATION_BACKUP_FILE=/tmp/fsb-ci-backup sh scripts/ops/migrate.sh
              echo "Re-running the guarded migration runner to verify checksum-safe idempotency"
              FSB_MIGRATION_BACKUP_FILE=/tmp/fsb-ci-backup sh scripts/ops/migrate.sh
              FSB_STAGING_TESTS=true bash scripts/ops/verify-staging.sh
              echo "Running disposable PostgreSQL custom-format backup and isolated restore drill"
              pg_dump -h 127.0.0.1 -U postgres -d fsb_ci -Fc -f /tmp/fsb-ci-restore-drill.dump
              createdb -h 127.0.0.1 -U postgres fsb_ci_restore
              pg_restore -h 127.0.0.1 -U postgres --no-owner --no-acl --exit-on-error -d fsb_ci_restore /tmp/fsb-ci-restore-drill.dump
              source_count="$(psql -h 127.0.0.1 -U postgres -d fsb_ci -Atqc 'SELECT count(*) FROM fsb_schema_migration_ledger')"
              restored_count="$(psql -h 127.0.0.1 -U postgres -d fsb_ci_restore -Atqc 'SELECT count(*) FROM fsb_schema_migration_ledger')"
              test "$source_count" = "$restored_count"
              test "$(psql -h 127.0.0.1 -U postgres -d fsb_ci_restore -Atqc "SELECT count(*) FROM information_schema.tables WHERE table_name='tenant_api_credentials'")" = "1"
              echo "Isolated database restore verified: $restored_count migration ledger rows"
            '
      - name: Validate operations shell scripts
        run: for script in scripts/ops/*.sh; do bash -n "$script"; done; bash -n scripts/staging-enterprise-acceptance.sh; bash -n scripts/staging-workflow-idempotency.sh
      - name: Validate production Compose configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env -f compose.production.yaml config --quiet
      - name: Build production API and Web images
        run: docker compose --env-file .env -f compose.production.yaml build api web
