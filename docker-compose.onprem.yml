services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/database/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [fsb_internal]
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SYNCHRONIZE: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?Set BOOTSTRAP_TOKEN}
      FSB_OUTBOX_ENCRYPTION_KEY: ${FSB_OUTBOX_ENCRYPTION_KEY:?Set FSB_OUTBOX_ENCRYPTION_KEY}
      FSB_FILE_STORAGE_PATH: /var/fsb/private-files
      FSB_NOTIFICATION_WORKER_ENABLED: "false"
      FSB_WORKFLOW_AUTOMATION_ENABLED: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - private_files:/var/fsb/private-files
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    networks: [fsb_internal]
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set public API URL}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks: [fsb_internal]
  worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["node","apps/api/dist/notifications/worker.main.js"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SYNCHRONIZE: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN}
      FSB_OUTBOX_ENCRYPTION_KEY: ${FSB_OUTBOX_ENCRYPTION_KEY}
      FSB_NOTIFICATION_WORKER_ENABLED: "true"
      FSB_WORKFLOW_AUTOMATION_ENABLED: "true"
      FSB_WORKFLOW_POLL_MS: ${FSB_WORKFLOW_POLL_MS:-30000}
      FSB_NOTIFICATION_POLL_MS: ${FSB_NOTIFICATION_POLL_MS:-5000}
      FSB_PUBLIC_APP_URL: ${FSB_PUBLIC_APP_URL:?Set public app URL}
      FSB_SMTP_HOST: ${FSB_SMTP_HOST:?Set SMTP host}
      FSB_SMTP_PORT: ${FSB_SMTP_PORT:-587}
      FSB_SMTP_SECURE: ${FSB_SMTP_SECURE:-false}
      FSB_SMTP_USER: ${FSB_SMTP_USER:-}
      FSB_SMTP_PASS: ${FSB_SMTP_PASS:-}
      FSB_EMAIL_FROM: ${FSB_EMAIL_FROM:?Set sender email}
    networks: [fsb_internal]
volumes:
  postgres_data:
  private_files:
networks:
  fsb_internal:
    driver: bridge
